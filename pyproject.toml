[project]
name = "linguadocs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ayaa-ch", email = "ayachakour2004@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "faster-whisper>=1.2.1",
    "fpdf2>=2.8.9",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "jiwer>=4.0.0",
    "lingua-language-detector>=2.1.1",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-magic-bin>=0.4.14",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
linguadocs = "linguadocs:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]
ui = [
    "streamlit>=1.40.0",
]
