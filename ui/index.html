<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LinguaDocs — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="api-banner" class="api-banner">⚠️ Cannot connect to API (port 8000). Make sure the server is running.</div>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">📚 LinguaDocs</div>
    <div class="auth-subtitle">Your multilingual document assistant</div>

    <div class="tabs">
      <button id="tab-login" class="tab active" type="button">Login</button>
      <button id="tab-register" class="tab" type="button">Register</button>
    </div>

    <!-- LOGIN -->
    <form id="form-login" autocomplete="on">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="••••••••" required />
      </div>
      <button class="btn" type="submit" id="btn-login">Login</button>
    </form>

    <!-- REGISTER -->
    <form id="form-register" style="display:none" autocomplete="on">
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" placeholder="Min 8 characters" required />
      </div>
      <div class="form-group">
        <label for="reg-confirm">Confirm Password</label>
        <input id="reg-confirm" type="password" placeholder="Repeat password" required />
      </div>
      <button class="btn" type="submit" id="btn-register">Create Account</button>
    </form>

    <div id="form-msg" class="form-msg"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
(function () {
  const { isEmailValid, apiErrorMessage, TOKEN_KEY } = window.LD;
  const API = window.LD.API_BASE;
  const tabLogin = document.getElementById("tab-login");
  const tabReg = document.getElementById("tab-register");
  const formLogin = document.getElementById("form-login");
  const formReg = document.getElementById("form-register");
  const msg = document.getElementById("form-msg");
  const banner = document.getElementById("api-banner");

  if (localStorage.getItem(TOKEN_KEY)) { window.location.href = "dashboard.html"; }

  function setTab(which) {
    const isLogin = which === "login";
    tabLogin.classList.toggle("active", isLogin);
    tabReg.classList.toggle("active", !isLogin);
    formLogin.style.display = isLogin ? "" : "none";
    formReg.style.display = isLogin ? "none" : "";
    msg.textContent = ""; msg.className = "form-msg";
  }
  tabLogin.addEventListener("click", () => setTab("login"));
  tabReg.addEventListener("click", () => setTab("register"));

  function showMsg(text, kind) {
    msg.textContent = text;
    msg.className = "form-msg " + kind;
  }

  formReg.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("reg-email").value.trim().toLowerCase();
    const pw = document.getElementById("reg-password").value;
    const confirm = document.getElementById("reg-confirm").value;
    if (!isEmailValid(email)) { showMsg("Please enter a valid email address.", "error"); return; }
    if (pw.length < 8) { showMsg("Password must be at least 8 characters.", "error"); return; }
    if (pw !== confirm) { showMsg("Passwords do not match.", "error"); return; }
    const btn = document.getElementById("btn-register");
    btn.disabled = true; btn.textContent = "Creating...";
    try {
      const res = await fetch(API + "/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password: pw })
      });
      if (res.status === 201) {
        banner.classList.remove("show");
        showMsg("Account created! Please login.", "success");
        formReg.reset();
        setTimeout(() => setTab("login"), 800);
      } else if (res.status === 400) {
        let detail = "";
        try { const j = await res.json(); detail = j.detail || ""; } catch (_) {}
        if (/utilis|already|existe/i.test(detail)) {
          showMsg("This email is already registered. Please login.", "error");
        } else {
          showMsg(detail || "Email already registered", "error");
        }
      } else {
        const err = new Error("http"); err.status = res.status;
        try { err.data = await res.json(); } catch (_) {}
        showMsg(apiErrorMessage(err, "Registration failed."), "error");
      }
    } catch (ex) {
      banner.classList.add("show");
      showMsg("Cannot connect to API (port 8000). Make sure the server is running.", "error");
    } finally {
      btn.disabled = false; btn.textContent = "Create Account";
    }
  });

  formLogin.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("login-email").value.trim().toLowerCase();
    const pw = document.getElementById("login-password").value;
    if (!isEmailValid(email)) { showMsg("Please enter a valid email address.", "error"); return; }
    if (!pw) { showMsg("Please enter your password.", "error"); return; }
    const btn = document.getElementById("btn-login");
    btn.disabled = true; btn.textContent = "Logging in...";
    try {
      const res = await fetch(API + "/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password: pw })
      });
      if (res.ok) {
        const data = await res.json();
        localStorage.setItem(TOKEN_KEY, data.access_token);
        try {
          const payload = JSON.parse(atob(data.access_token.split(".")[1]));
          if (payload.sub) localStorage.setItem("linguadocs_email", email);
        } catch (_) { localStorage.setItem("linguadocs_email", email); }
        banner.classList.remove("show");
        window.location.href = "dashboard.html";
      } else if (res.status === 401) {
        showMsg("Invalid email or password", "error");
      } else {
        const err = new Error("http"); err.status = res.status;
        try { err.data = await res.json(); } catch (_) {}
        showMsg(apiErrorMessage(err, "Login failed."), "error");
      }
    } catch (ex) {
      banner.classList.add("show");
      showMsg("Cannot connect to API (port 8000). Make sure the server is running.", "error");
    } finally {
      btn.disabled = false; btn.textContent = "Login";
    }
  });
})();
</script>
</body>
</html>
